name: CI

# The app's backend tests. They run offline: the only network use is installing
# the pinned test dependencies, and no test opens a socket beyond aiohttp's
# loopback test server.
#
# The OS matrix is the manifest's `platform.os` claim. That field is a published
# capability label, so every OS it names is tested here; Windows matters most,
# because an unclosed sqlite handle blocks uninstall only there.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Kiro Crew requires Python >= 3.12, and hooks run in the gateway's own
        # interpreter, so this is the floor the app must work on.
        python: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Validate app.json is JSON
        run: python -c "import json; json.load(open('app.json', encoding='utf-8'))"

      - name: Run tests
        run: python -m pytest
